<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Calendar frame -->
  <rect x="2" y="5" width="28" height="25" rx="3" fill="#5b4fd6" opacity="0.15"/>
  <rect x="2" y="5" width="28" height="25" rx="3" fill="none" stroke="#5b4fd6" stroke-width="2"/>
  <!-- Calendar top bar -->
  <rect x="2" y="5" width="28" height="7" rx="3" fill="#5b4fd6"/>
  <!-- Calendar hooks -->
  <rect x="9" y="2" width="2.5" height="6" rx="1.25" fill="#5b4fd6"/>
  <rect x="20.5" y="2" width="2.5" height="6" rx="1.25" fill="#5b4fd6"/>
  <!-- Gantt bars -->
  <rect x="6" y="15" width="14" height="3" rx="1.5" fill="#7c6aef"/>
  <rect x="10" y="20" width="16" height="3" rx="1.5" fill="#5b4fd6"/>
  <rect x="8" y="25" width="10" height="3" rx="1.5" fill="#9d8ff5"/>
</svg>
